        arr[9*t + 3*j] = c[0]; arr[9*t + 3*j + 1] = c[1]; arr[9*t + 3*j + 2] = c[2];
      }
    }
    hue.needsUpdate = true;
  }
  paintTracks();
}

function paintToken(k, hex) {
  document.documentElement.style.setProperty("--" + k, hex);
  if (PAL[k]) PAL[k] = hexToRgb(hex);
  repaint();
  draw(frame());
}

/* The light moved: everything downstream of it has to be rebuilt, which is the body's
   shading, the shadows, and the framing that has to contain them.  Not the camera --
   `fit` re-scales for the new extent while leaving the orbit and the zoom alone. */
function relight() {
  LIGHT = lightFor(HOME_YAW);
  repaint();
  clouds();
  fit();
  draw(frame());
}

/* Move the camera home, and the light with it.  The light is a function of the home
   yaw and pitch, the shadows are a function of the light, and the cloud the framing
   reads contains those shadows -- so all four move together or the framing is fitted
   to shadows that are no longer there. */
function recam() {
  HOME_YAW = LOOK.yaw;      /* the studio is never auto-turned */
  LIGHT = lightFor(HOME_YAW);
  repaint();
  clouds();
  home();
  if (refreshLight) refreshLight();   /* moving the camera can move the shadow in front */
}
let refreshLight = null;

/* Re-lane and re-frame.  Which lane each run is in, and where its vertices therefore
   are for the purpose of pointing a camera at them, is one decision -- so the offset,
   the cloud it feeds and the framing that reads it move together or not at all. */
function relane() {
  SPACING = DATA.spacing * LOOK.lanes;
  RUNS.forEach((r, i) => { r.group.position.y = laneY(i, RUNS.length); });
  clouds();
  fit();
  draw(frame());
}

/* ---- recording ------------------------------------------------------------------
   `captureStream(0)` hands back a stream that captures nothing on its own: a frame
   goes in only when requestFrame() says so.  That is the whole point -- the film then
   holds exactly the frames chosen here, one each, where letting the browser capture a
   live canvas records whatever the compositor happened to catch and drops or repeats
   frames under load.  Emission is still paced in real time, because MediaRecorder
   timestamps a frame when it arrives, so pushing them as fast as they render would
   produce a correct but comically fast film.

   It records the mode it is in, walking that mode's own index space: the frames of
   the swim, or the iterates of the descent.  Its framing is whatever the camera is
   pointed at, and the panels are DOM and never appear in it. */
const RECORDABLE = typeof MediaRecorder !== "undefined" && !!canvas.captureStream;
/* MP4/H.264 first, where the browser will record it (Safari 16.4+, recent Chrome):
   it drops into Keynote, LaTeX and a slide with no conversion step.  WebM is the
   fallback, and `ffmpeg -i in.webm -c:v prores_ks out.mov` converts it. */
const MP4_TYPES = ["video/mp4;codecs=avc1", "video/mp4"];
const WEBM_TYPES = ["video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"];
function pickType() {
  if (!RECORDABLE) return null;
  const wanted = FILM.format === "mp4" ? MP4_TYPES
               : FILM.format === "webm" ? WEBM_TYPES
               : MP4_TYPES.concat(WEBM_TYPES);
  return wanted.find(t => MediaRecorder.isTypeSupported(t)) || null;
}
const extFor = type => (type.indexOf("mp4") !== -1 ? "mp4" : "webm");
const takeName = () => RUN + (MODE === "descent" ? "-descent" : "");

function save(blob, ext, say) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = takeName() + "." + ext;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
  say((blob.size / 1e6).toFixed(2) + " MB");
}

async function record(say) {
  const type = pickType();
  if (!type) { say("no encoder"); return; }

  /* The subject can run faster than the film's frame rate, and above 60 faster than a
     display refreshes.  When it does, the film samples it and steps further through
     the sequence for each frame it keeps; the duration is steps / rate either way. */
  const emit = Math.min(rate(), FILM.fps), step = rate() / emit;
  const shots = Math.max(1, Math.ceil(steps() / step));

  /* Grow the backing store for the take, so the film is as dense as FILM.scale asks
     and not as dense as this monitor happens to be.  Everything is drawn through the
     camera in world units, so the picture is identical, just finer. */
  captureScale = FILM.scale;
  resize();
  const canvasSize = canvas.width + "×" + canvas.height;

  /* Ask for a stream that captures only when told.  If this browser has no
     requestFrame, that stream would capture nothing at all, so fall back to one that
     samples on its own at the emission rate. */
  let stream = canvas.captureStream(0);
  let vtrack = stream.getVideoTracks()[0];
  const manual = typeof vtrack.requestFrame === "function";
  if (!manual) {
    vtrack.stop();
    stream = canvas.captureStream(emit);
    vtrack = stream.getVideoTracks()[0];
  }
  const rec = new MediaRecorder(stream, { mimeType: type,
                                          videoBitsPerSecond: FILM.mbps * 1e6 });
  const chunks = [];
  rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  const finished = new Promise(done => { rec.onstop = done; });

  const wasPlaying = playing, wasAt = frame();
  playing = false;
  rec.start();
  say("0%");
  let due = performance.now();
  for (let n = 0; n < shots; n++) {
    draw(Math.min(steps() - 1, n * step));
    if (manual) vtrack.requestFrame();
    say(Math.round(100 * n / shots) + "%");
    due += 1000 / emit;
    await new Promise(r => setTimeout(r, Math.max(0, due - performance.now())));
  }
  rec.stop();
  await finished;
  vtrack.stop();
  captureScale = 0;
  resize();
  draw(wasAt);
  playing = wasPlaying;

  const blob = new Blob(chunks, { type });
  save(blob, extFor(type), say);
  console.log("recorded", shots, "frames,", canvasSize, type,
              (blob.size / 1e6).toFixed(2), "MB");
}

/* A still of whatever is on the canvas, at FILM.scale, with no panel in it. */
function saveImage(say) {
  return new Promise(resolve => {
    captureScale = FILM.scale;
    resize();                       /* redraws at the export size */
    canvas.toBlob(blob => {
      captureScale = 0;
      resize();
      save(blob, "png", say);
      resolve();
    }, "image/png");
  });
}

/* ---- the panels ---- */
function shell(id, title) {
  const box = document.createElement("div");
  box.id = id; box.className = "panel";
  const head = document.createElement("h2");
  head.innerHTML = "<span>" + title + "</span><span>&minus;</span>";
  head.onclick = () => box.classList.toggle("shut");
  box.appendChild(head);
  return box;
}

/* An exclamation beside the light's turn when it has come round in front of the
   camera.  Reads `LOOK` rather than `LIGHT`, because a slider writes its readout
   before its `after` runs and `LIGHT` is still the old vector at that moment. */
const mark = () => (shadowAstern() ? "" : " !");

function slider(box, into, [key, name, lo, hi, step, format], after) {
  const row = document.createElement("label"), out = document.createElement("span");
  const input = document.createElement("input");
  Object.assign(input, { type: "range", min: lo, max: hi, step, value: into[key] });
  const show = v => { out.textContent = format ? format(v) : v; };
  show(into[key]);
  input.oninput = () => {
    into[key] = parseFloat(input.value);
    show(into[key]);
    if (after) after(); else { repaint(); draw(frame()); }
  };
  row.append(Object.assign(document.createElement("span"), { textContent: name }), input, out);
  box.appendChild(row);
  return () => show(into[key]);
}

function lookPanel() {
  const box = shell("look", "look");
  for (const g of GROUPS) {
    const head = Object.assign(document.createElement("h3"), { textContent: g.title });
    const rows = document.createElement("div");
    /* A group folds away on its own, so the panel can be as tall as the thing being
       worked on rather than as tall as everything it is able to change. */
    head.onclick = () => rows.classList.toggle("shut");
    box.append(head, rows);

    /* Neither of these repaints a material, and they are not the same move.  Changing
       the gap re-places the lanes and rebuilds the cloud the framing reads, but must
       NOT send the camera home -- you set the gap while looking at something, and
       having the orbit snap back every time you nudged the slider made it unusable.
       Changing yaw or pitch IS going home, since that is where those two live. */
    const after = g.relane ? relane : g.recam ? recam
                : g.relight ? relight : null;
    const made = (g.sliders || []).map(spec => slider(rows, LOOK, spec, after));
    if (g.relight) refreshLight = () => made.forEach(f => f());

    for (const [key, name] of g.toggles || []) {
      const row = document.createElement("label"), input = document.createElement("input");
      Object.assign(input, { type: "checkbox", checked: LOOK[key] });
      input.onchange = () => {
        LOOK[key] = input.checked;
        if (after) after(); else { repaint(); draw(frame()); }
      };
      row.append(Object.assign(document.createElement("span"), { textContent: name }),
                 input, document.createElement("span"));
      rows.appendChild(row);
    }

    for (const [key, name] of g.swatches || []) {
      const row = document.createElement("label"), input = document.createElement("input");
      Object.assign(input, { type: "color", value: token(key) });
      input.oninput = () => paintToken(key, input.value);
      row.append(Object.assign(document.createElement("span"), { textContent: name }),
                 input, document.createElement("span"));
      rows.appendChild(row);
    }
  }

  const out = document.createElement("textarea");
  out.spellcheck = false; out.style.display = "none";
  const buttons = document.createElement("div");
  buttons.className = "row";
  const copy = Object.assign(document.createElement("button"), { textContent: "copy" });
  copy.onclick = () => {
    const keys = LOOK_KEYS();
    const pad = Math.max(...keys.concat(FILM_SLIDERS).map(s => s[0].length)) + 2;
    /* every token this file declares, in its order, so the block drops straight in */
    const ORDER = ["ground", "deep", "actuated", "passive", "hull", "edge",
                   "accent", "trail", "hairline"];
    const block =
      ":root {\n"
      + ORDER.map(k => "  --" + (k + ":").padEnd(10) + " " + token(k).toUpperCase() + ";").join("\n")
      + "\n}\n\nconst LOOK = {\n"
      + keys.map(([k]) => "  " + (k + ":").padEnd(pad) + " " + LOOK[k] + ",").join("\n")
      + "\n};\n\nconst FILM = {\n"
      + FILM_SLIDERS.map(([k]) => "  " + (k + ":").padEnd(pad) + " " + FILM[k] + ",").join("\n")
      + "\n  " + "format:".padEnd(pad) + " " + JSON.stringify(FILM.format) + ",\n};\n";
    out.value = block; out.style.display = "block"; out.select();
    if (navigator.clipboard) navigator.clipboard.writeText(block).catch(() => {});
  };
  const reset = Object.assign(document.createElement("button"), { textContent: "reset" });
  reset.onclick = () => location.reload();
  buttons.append(copy, reset);
  box.append(buttons, out);
  document.body.appendChild(box);
}

/* Everything about *when*: which mode the page is in, and how fast its sequence goes
   by.  The two speeds swap -- a swim's frame rate means nothing to a descent, whose
   steps are not instants -- so neither is left on screen in the mode where it does
   not apply. */
let refreshFilm = () => {};
function timePanel() {
  const box = shell("time", "time");

  const modeRow = document.createElement("label");
  modeRow.className = "mode";
  const pick = document.createElement("select");
  const OPTIONS = [["swim", "Trajectory"]].concat(NK ? [["descent", "Optimization"]] : []);
  for (const [value, label] of OPTIONS)
    pick.appendChild(Object.assign(document.createElement("option"),
                                   { value, textContent: label }));
  pick.value = MODE;
  modeRow.appendChild(pick);
  box.appendChild(modeRow);

  const swimRow = document.createElement("div"), stepRow = document.createElement("div");
  box.append(swimRow, stepRow);
  slider(swimRow, LOOK, PLAY_SLIDERS[0], () => refreshFilm());
  slider(stepRow, LOOK, PLAY_SLIDERS[1], () => refreshFilm());

  const note = Object.assign(document.createElement("p"), { className: "note" });
  box.appendChild(note);
  /* The one place a number is spelled out on this page: which iterate is on screen
     and what the objective was there.  A descent is the mode where that matters --
     the shape alone does not say whether the step helped. */
  tellTime = at => { note.textContent = legend(at); };

  function onMode() {
    const descending = MODE === "descent";
    swimRow.style.display = descending ? "none" : "";
    stepRow.style.display = descending ? "" : "none";
    refreshFilm();
  }
  pick.onchange = () => { setMode(pick.value); onMode(); };
  onMode();
  document.body.appendChild(box);
}

function filmPanel() {
  const box = shell("film", "film");
  const note = Object.assign(document.createElement("p"), { className: "note" });

  const go = Object.assign(document.createElement("button"), { textContent: "record" });
  if (!RECORDABLE) go.title = "this browser cannot record a canvas";
  go.onclick = async () => {
    if (go.disabled) return;
    go.disabled = true;
    try { await record(t => { go.textContent = t; }); }
    catch (e) { go.textContent = "failed"; console.error(e); }
    setTimeout(() => { go.textContent = "record"; refresh(); }, 2500);
  };

  /* What the take will be, before committing eight seconds to finding out. */
  const refresh = () => {
    const size = Math.round(W * FILM.scale) + "×" + Math.round(H * FILM.scale);
    const type = pickType();
    note.textContent = size
      + "  ·  " + (steps() / rate()).toFixed(1) + " s"
      + "  ·  " + Math.round(Math.min(rate(), FILM.fps)) + " fps"
      + "  ·  " + (type ? extFor(type) : "no encoder");
    go.disabled = !RECORDABLE;
  };
  refreshFilm = refresh;

  for (const spec of FILM_SLIDERS) slider(box, FILM, spec, refresh);

  const row = document.createElement("label");
  const fmt = document.createElement("select");
  for (const [value, label] of [["auto", "mp4 if able"], ["mp4", "mp4 only"],
                                ["webm", "webm"]]) {
    fmt.appendChild(Object.assign(document.createElement("option"),
                                  { value, textContent: label }));
  }
  fmt.value = FILM.format;
  fmt.onchange = () => { FILM.format = fmt.value; refresh(); };
  row.append(Object.assign(document.createElement("span"), { textContent: "format" }),
             fmt, document.createElement("span"));
  box.append(row, note);

  const buttons = document.createElement("div");
  buttons.className = "row";
  const still = Object.assign(document.createElement("button"),
                              { textContent: "screenshot" });
  still.title = "save what is on the canvas, at the export scale";
  still.onclick = async () => {
    still.disabled = true;
    try { await saveImage(t => { still.textContent = t; }); }
    catch (e) { still.textContent = "failed"; console.error(e); }
    setTimeout(() => { still.textContent = "screenshot"; still.disabled = false; }, 2500);
  };
  buttons.append(go, still);
  box.appendChild(buttons);
  document.body.appendChild(box);
  refresh();
  window.addEventListener("resize", refresh);
}

window.addEventListener("resize", () => { if (DATA) resize(); });
window.addEventListener("orientationchange", () => setTimeout(() => { if (DATA) resize(); }, 120));
window.addEventListener("keydown", e => {
  if (e.key === " " && e.target === document.body) { playing = !playing; e.preventDefault(); }
});
</script>
